name: Poem Maker Generator

on:
  repository_dispatch:
    types: [generate_poem]
  workflow_dispatch:
    inputs:
      test_payload:
        description: 'JSON string for testing manually'
        required: false
        default: '{"scenes":[{"text":"Test manually","image_url":""}]}'

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # NEW: Cache the Coqui AI models so we don't redownload them every time
      - name: Cache TTS Models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tts
          key: tts-models-${{ runner.os }}

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # NEW: Install CPU-only PyTorch to save gigabytes of download time
      - name: Install Python Dependencies (Optimized for CPU)
        run: |
          # Install lightweight CPU version of PyTorch (Pinned to 2.5.1 to prevent weights_only error)
          pip install "torch==2.5.1" "torchaudio==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          # Then install TTS and the rest
          pip install -r requirements.txt

      - name: Save JSON Payload to File
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            cat << 'EOF' > payload.json
            ${{ toJson(github.event.client_payload) }}
          EOF
          else
            cat << 'EOF' > payload.json
            ${{ github.event.inputs.test_payload }}
          EOF
          fi

      # NEW STEP: Adds 8GB of Virtual RAM so the machine doesn't freeze!
      - name: Create Swap Space (Prevent Out-of-Memory Freezes)
        run: |
          # We use 'dd' instead of 'fallocate' to bypass GitHub runner filesystem restrictions
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

          
      - name: Run Orchestrator
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        # Added -u to python to force the logs to print instantly (unbuffered)
        run: python -u src/orchestrator.py --payload payload.json

      - name: Upload Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final_poem_video
          path: workspace/final_poem.mp4
          retention-days: 7
